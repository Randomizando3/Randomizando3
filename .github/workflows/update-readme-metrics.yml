name: Update README metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate metrics
        run: node .github/scripts/generate-github-metrics.mjs
        env:
          GITHUB_OWNER: Randomizando3
          GITHUB_TOKEN_STATS: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit generated assets
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/github-activity.svg; then
            echo "No metric changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-activity.svg
          git commit -m "999 - Atualiza metricas automaticas | profile-stats"
          git push
